openapi: 3.1.0
info:
  title: Ascoor API
  version: 0.1.0
  description: API contract for the Ascoor 3D AssetPack editor backend.
servers:
  - url: http://localhost:3100
    description: Local development server
security:
  - bearerAuth: []
paths:
  /:
    get:
      security: []
      operationId: getRoot
      tags:
        - system
      summary: Return a friendly placeholder message.
      responses:
        '200':
          description: Root message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'
  /health:
    get:
      security: []
      operationId: getHealth
      tags:
        - system
      summary: Health check endpoint.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /users/me:
    patch:
      operationId: updateUser
      tags:
        - users
      summary: Update the authenticated user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Paid plan required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUser
      tags:
        - users
      summary: Delete the authenticated user account and all associated data.
      responses:
        '204':
          description: User deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/bootstrap:
    post:
      operationId: bootstrapUser
      tags:
        - users
      summary: Bootstrap the authenticated user and create the default workspace.
      responses:
        '204':
          description: User bootstrap completed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pack-generation-jobs:
    post:
      operationId: createPackGenerationJob
      tags:
        - pack-generation-jobs
      summary: Queue an asset pack generation job from a raw user prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackGenerationJobRequest'
      responses:
        '202':
          description: Pack generation job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackGenerationJobResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrent pack generation limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pack-generation-jobs/{packGenerationJobId}:
    get:
      operationId: getPackGenerationJob
      tags:
        - pack-generation-jobs
      summary: Get pack generation job status.
      parameters:
        - name: packGenerationJobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pack generation job status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackGenerationJobResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Pack generation job failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /asset-packs:
    post:
      operationId: createAssetPack
      tags:
        - assetPacks
      summary: Create a new workspace asset pack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetPackRequest'
      responses:
        '201':
          description: AssetPack created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPackResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /asset-packs/{assetPackId}/assets/content:
    get:
      operationId: getAssetPackAssetContent
      tags:
        - assetPacks
      summary: Get render asset content for an asset pack.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [ts]
      responses:
        '200':
          description: Asset content retrieved
          content:
            text/javascript:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /asset-packs/{assetPackId}/edited-model:
    get:
      operationId: getEditedModel
      tags:
        - assetPacks
      summary: Get the saved edited GLB model for an asset pack.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Edited model retrieved
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: saveEditedModel
      tags:
        - assetPacks
      summary: Save the edited GLB model for an asset pack.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          model/gltf-binary:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Edited model saved
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: clearEditedModel
      tags:
        - assetPacks
      summary: Delete the saved edited GLB model for an asset pack.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Edited model deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /asset-packs/{assetPackId}/preview-results:
    post:
      operationId: reportAssetPackPreviewResult
      tags:
        - assetPacks
      summary: Record the latest preview result for a generated asset pack.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportAssetPackPreviewResultRequest'
      responses:
        '204':
          description: Preview result recorded
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /asset-packs/{assetPackId}:
    get:
      operationId: getAssetPack
      tags:
        - assetPacks
      summary: Get asset pack details and the latest linked pack generation job.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AssetPack detail retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPackDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateAssetPack
      tags:
        - assetPacks
      summary: Update asset pack metadata.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetPackRequest'
      responses:
        '200':
          description: AssetPack updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPackResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAssetPack
      tags:
        - assetPacks
      summary: Delete an asset pack.
      parameters:
        - name: assetPackId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: AssetPack deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces:
    post:
      operationId: createWorkspace
      tags:
        - workspaces
      summary: Create a new workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listWorkspaces
      tags:
        - workspaces
      summary: List workspaces for the authenticated user.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of workspaces to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          description: Cursor returned by the previous paginated response.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive search text for workspace names.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Workspaces retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}:
    patch:
      operationId: updateWorkspace
      tags:
        - workspaces
      summary: Update a workspace.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWorkspace
      tags:
        - workspaces
      summary: Delete a workspace.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Workspace deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/pack-generation-jobs:
    get:
      operationId: listWorkspacePackGenerationJobs
      tags:
        - workspaces
      summary: List pack generation jobs for a workspace.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by one or more pack generation job statuses.
          schema:
            oneOf:
              - type: string
                enum: [queued, running, succeeded, failed]
              - type: array
                items:
                  type: string
                  enum: [queued, running, succeeded, failed]
        - name: limit
          in: query
          required: false
          description: Maximum number of pack generation jobs to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          description: Cursor returned by the previous paginated response.
          schema:
            type: string
      responses:
        '200':
          description: Pack generation jobs retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePackGenerationJobsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/asset-packs:
    get:
      operationId: listWorkspaceAssetPacks
      tags:
        - workspaces
      summary: List asset-packs for a workspace.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AssetPacks retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAssetPacksResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/thumbnail/content:
    get:
      operationId: getWorkspaceThumbnailContent
      tags:
        - workspaces
      summary: Get the saved workspace thumbnail image.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace thumbnail image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateWorkspaceThumbnailContent
      tags:
        - workspaces
      summary: Save or replace the workspace thumbnail image.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Workspace thumbnail saved
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/status:
    get:
      operationId: getBillingStatus
      tags:
        - billing
      summary: Get billing status for the authenticated user.
      responses:
        '200':
          description: Billing status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/usage:
    get:
      operationId: getBillingUsage
      tags:
        - billing
      summary: Get credit usage for the authenticated user.
      responses:
        '200':
          description: Billing usage retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/portal-session:
    post:
      operationId: createBillingPortalSession
      tags:
        - billing
      summary: Create a Stripe Billing Portal session.
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPortalSessionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/checkout-session:
    post:
      operationId: createCheckoutSession
      tags:
        - billing
      summary: Create a Stripe checkout session for a subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Subscription already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/cancel:
    post:
      operationId: cancelSubscription
      tags:
        - billing
      summary: Cancel a subscription at period end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '204':
          description: Cancellation accepted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/cancel-immediately:
    post:
      operationId: cancelSubscriptionImmediately
      tags:
        - billing
      summary: Cancel a subscription immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '204':
          description: Immediate cancellation accepted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/resume-cancel:
    post:
      operationId: resumeSubscriptionCancellation
      tags:
        - billing
      summary: Resume an active subscription by removing period-end cancellation.
      responses:
        '204':
          description: Cancellation schedule removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/webhook:
    post:
      security: []
      operationId: handleStripeWebhook
      tags:
        - billing
      summary: Stripe webhook endpoint.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookResponse'
        '400':
          description: Missing signature or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RootResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: ascoor API placeholder
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    BillingPlan:
      type: object
      required:
        - id
        - key
        - name
        - stripePriceId
        - amount
        - currency
        - interval
        - intervalCount
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        key:
          type: string
          enum: [free, hobby, pro]
        name:
          type: string
        stripePriceId:
          type: string
          nullable: true
        amount:
          type: integer
          format: int32
        currency:
          type: string
          example: usd
        interval:
          type: string
          enum: [month, year]
        intervalCount:
          type: integer
          format: int32
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BillingStatus:
      type: object
      required:
        - status
        - plan
        - currentPeriodEnd
        - cancelAtPeriodEnd
      properties:
        status:
          type: string
          enum: [none, incomplete, incomplete_expired, trialing, active, past_due, canceled, unpaid, paused]
        plan:
          $ref: '#/components/schemas/BillingPlan'
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
    BillingStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BillingStatus'
    BillingUsage:
      type: object
      required:
        - balance
        - monthlyCredits
        - usedCredits
        - periodStart
        - periodEnd
      properties:
        balance:
          type: integer
          format: int32
        monthlyCredits:
          type: integer
          format: int32
        usedCredits:
          type: integer
          format: int32
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
    BillingUsageResponse:
      allOf:
        - $ref: '#/components/schemas/BillingUsage'
    CreateCheckoutSessionRequest:
      type: object
      properties:
        planId:
          type: string
          format: uuid
        planKey:
          type: string
          enum: [hobby, pro]
    CreateCheckoutSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    CancelSubscriptionRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/CancellationReason'
        details:
          type: string
          maxLength: 300
    CancellationReason:
      type: string
      enum:
        - pricing
        - features
        - complex
        - switch
        - other
    BillingWebhookResponse:
      type: object
      additionalProperties: true
    BillingPortalSessionResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    CreatePackGenerationJobRequest:
      type: object
      required:
        - workspaceId
        - userPrompt
      properties:
        workspaceId:
          type: string
          description: Workspace ID that will own the generated asset pack.
        userPrompt:
          type: string
          minLength: 1
          maxLength: 3000
          description: Raw user input prompt before AI template compilation.
    PackGenerationJobResponse:
      type: object
      required:
        - packGenerationJobId
        - status
        - userPrompt
      properties:
        packGenerationJobId:
          type: string
          description: Pack generation job ID.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        userPrompt:
          type: string
          nullable: true
          description: Raw user input prompt.
        message:
          type: string
          nullable: true
          description: Assistant message for the user when completed.
        title:
          type: string
          nullable: true
          description: Suggested display name for the generated asset pack.
        assetPackId:
          type: string
          nullable: true
          description: ID of the created asset pack when code is generated.
        errorMessage:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
          description: Machine-readable failure code.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetPackDetailResponse:
      type: object
      required:
        - assetPack
        - latestPackGenerationJob
      properties:
        assetPack:
          $ref: '#/components/schemas/WorkspaceAssetPackSummary'
        latestPackGenerationJob:
          type: object
          nullable: true
          required:
            - packGenerationJobId
            - status
            - userPrompt
            - createdAt
            - updatedAt
          properties:
            packGenerationJobId:
              type: string
            status:
              type: string
              enum: [queued, running, succeeded, failed]
            userPrompt:
              type: string
            message:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CreateWorkspaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
    UpdateWorkspaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
    WorkspaceResponse:
      allOf:
        - $ref: '#/components/schemas/WorkspaceResponseData'
    WorkspaceResponseData:
      type: object
      required:
        - id
        - name
        - thumbnailAssetUri
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        thumbnailAssetUri:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspacesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponseData'
        nextCursor:
          type: string
          nullable: true
    WorkspaceAssetPacksResponse:
      allOf:
        - $ref: '#/components/schemas/WorkspaceAssetPacksResponseData'
    WorkspaceAssetPacksResponseData:
      type: object
      required:
        - workspaceId
        - assetPacks
      properties:
        workspaceId:
          type: string
        assetPacks:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAssetPackSummary'
    WorkspacePackGenerationJobsResponse:
      type: object
      required:
        - workspaceId
        - items
        - nextCursor
      properties:
        workspaceId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspacePackGenerationJobSummary'
        nextCursor:
          type: string
          nullable: true
    WorkspacePackGenerationJobSummary:
      type: object
      required:
        - packGenerationJobId
        - workspaceId
        - status
        - userPrompt
        - promptPreview
        - createdAt
        - updatedAt
      properties:
        packGenerationJobId:
          type: string
        workspaceId:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        userPrompt:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        assetPackId:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        promptPreview:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceAssetPackSummary:
      type: object
      required:
        - id
        - workspaceId
        - displayName
        - previewStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        workspaceId:
          type: string
        displayName:
          type: string
        assetUriTs:
          type: string
          nullable: true
        previewStatus:
          type: string
          enum: [unverified, succeeded, failed]
        previewError:
          type: string
          nullable: true
        editedAssetUriGlb:
          type: string
          nullable: true
        editedAssetUpdatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAssetPackRequest:
      type: object
      required:
        - workspaceId
        - displayName
      properties:
        workspaceId:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 300
    AssetPackResponse:
      type: object
      required:
        - id
        - workspaceId
        - displayName
        - previewStatus
        - updatedAt
      properties:
        id:
          type: string
        workspaceId:
          type: string
        displayName:
          type: string
        assetUriTs:
          type: string
          nullable: true
        previewStatus:
          type: string
          enum: [unverified, succeeded, failed]
        previewError:
          type: string
          nullable: true
        editedAssetUriGlb:
          type: string
          nullable: true
        editedAssetUpdatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateAssetPackRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 300
    ReportAssetPackPreviewResultRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [succeeded, failed]
        errorMessage:
          type: string
          maxLength: 2000
    UpdateUserRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 300
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/UserResponseData'
    UserResponseData:
      type: object
      required:
        - id
        - email
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
